# Override: run DHYEYA against PostgreSQL instead of SQLite.
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# Requires POSTGRES_PASSWORD in .env.
services:
  dhyeya:
    environment:
      DB_CLIENT: pg
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: dhyeya
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: dhyeya
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhyeya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dhyeya
    volumes:
      - dhyeya-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhyeya -d dhyeya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dhyeya-pg:
